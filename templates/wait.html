{% extends "base.html" %}
{% block body %}

{# 사진은 이미 서버가 들고 있다. 이 화면은 결과가 나왔는지 물어보기만 한다.
   그래서 폰이 잠겨도 작업이 안 죽는다. 다시 켜면 이어서 물어본다. #}
<div class="card p-6 text-center">
  <div class="inline-flex items-center gap-2 text-sm text-slate-600">
    <span class="inline-block w-4 h-4 border-2 border-slate-300 border-t-slate-700
                 rounded-full animate-spin"></span>
    <span id="what">사진에서 글자를 읽고 있습니다</span>
  </div>

  <div class="mt-4 h-1.5 bg-slate-200 rounded-full overflow-hidden">
    <div id="bar" class="h-full bg-slate-700 rounded-full transition-all duration-500 ease-linear"
         style="width:0%"></div>
  </div>

  <div class="mt-2 text-xs text-slate-400">
    <span id="elapsed">0</span>초 지났습니다 · <span id="hint">보통 20초, 글자가 많으면 60초까지</span>
  </div>

  <div class="mt-5 text-xs text-slate-500 leading-relaxed">
    이 화면을 닫아도 됩니다. 읽기는 계속됩니다.<br>
    이 주소를 다시 열면 결과를 볼 수 있습니다.
  </div>
</div>

<div id="dead" class="hidden card p-5 mt-4 border-rose-200 bg-rose-50">
  <div class="text-sm text-rose-800" id="deadmsg"></div>
  <a href="/" class="inline-block mt-3 text-sm font-medium text-rose-900 underline">
    처음으로 돌아가기
  </a>
</div>

<script>
(function () {
  var ID = {{ job.id | tojson }};
  var EST = {{ (job.photos * 25 + eta) | int }};   // 서버가 계산한 내 예상 시간
  var t0 = Date.now() - {{ job.elapsed_ms | int }};

  var bar = document.getElementById('bar');
  var el = document.getElementById('elapsed');
  var hint = document.getElementById('hint');
  var what = document.getElementById('what');
  var timer = null, poll = null;

  function stop(msg) {
    clearInterval(timer); clearInterval(poll);
    document.getElementById('deadmsg').textContent = msg;
    document.getElementById('dead').classList.remove('hidden');
    document.querySelector('.card').classList.add('opacity-40');
  }

  // 막대는 작업 진행률이 아니라 예상 시간 대비 경과다. 서버가 몇 %를
  // 했는지는 모른다. 예상까지 90% 까지만 채우고 그 뒤로는 지수적으로
  // 느려지며 99% 에 수렴한다. 다 됐다고 거짓말하지 않는다.
  timer = setInterval(function () {
    var s = (Date.now() - t0) / 1000;
    el.textContent = Math.round(s);
    var pct = s <= EST ? 90 * (s / EST)
                       : 90 + 9 * (1 - Math.exp(-(s - EST) / EST));
    bar.style.width = pct.toFixed(1) + '%';
    if (s > EST * 1.5) { hint.textContent = '예상보다 걸리고 있습니다. 멈춘 것이 아닙니다'; }
  }, 500);

  function ask() {
    fetch('/job/' + encodeURIComponent(ID))
      .then(function (r) {
        if (r.status === 404) { throw new Error('expired'); }
        return r.json();
      })
      .then(function (j) {
        if (j.state === 'done') {
          clearInterval(timer); clearInterval(poll);
          bar.style.width = '100%';
          location.href = '/confirm/' + encodeURIComponent(ID);
          return;
        }
        if (j.state === 'error') {
          stop('사진을 읽는 중에 문제가 생겼습니다. 다시 올려주세요.');
          return;
        }
        if (j.state === 'abandoned') {
          stop('대기 중에 연결이 끊겨 취소되었습니다. 다시 올려주세요.');
          return;
        }
        if (j.state === 'queued' && j.position > 0) {
          what.textContent = '앞에 ' + j.position + '명 있습니다';
          hint.textContent = '약 ' + Math.ceil(j.eta_sec / 10) * 10 + '초 뒤에 시작합니다';
        } else if (j.state === 'running') {
          what.textContent = '사진에서 글자를 읽고 있습니다';
        }
      })
      .catch(function (e) {
        // 네트워크가 잠깐 끊긴 것과 결과가 사라진 것은 다르다.
        if (e && e.message === 'expired') {
          stop('결과가 만료되었거나 서버가 다시 시작됐습니다. 다시 올려주세요.');
        }
      });
  }

  ask();
  poll = setInterval(ask, 2000);

  // 폰이 잠기면 브라우저가 setInterval 을 늦춘다. 다 됐는데 화면만 안
  // 바뀌는 구간이 생기므로, 돌아온 즉시 한 번 더 묻는다. 이 화면의
  // 존재 이유가 바로 이 경우다.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { ask(); }
  });
})();
</script>
{% endblock %}
