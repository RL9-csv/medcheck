<div class="card p-5">
  <div class="font-medium mb-1">최근 신경 쓰이는 것이 있나요?</div>
  <p class="text-sm text-slate-500 mb-3">선택하시면 관련된 확인사항을 먼저 보여드립니다. 선택하지 않으셔도 됩니다.</p>
  <div class="flex flex-wrap gap-2">
    {% for key, label in symptoms %}
    <label class="cursor-pointer">
      <input type="checkbox" name="symptom" value="{{ key }}" class="peer sr-only">
      <span class="inline-block px-3.5 py-2 text-sm border rounded-full
                   peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800">
        {{ label }}
      </span>
    </label>
    {% endfor %}
  </div>
</div>
