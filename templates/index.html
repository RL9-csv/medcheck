{% extends "base.html" %}
{% block body %}
<form method="post" action="/confirm" class="space-y-5">

  <div class="card p-5">
    <div class="font-medium mb-1">약봉투별로 약 이름을 적어주세요</div>
    <p class="text-sm text-slate-500 mb-4">병원이나 약국이 다르면 봉투를 나눠서 넣어주세요. 한 줄에 하나씩.</p>

    {% for i in [1,2,3] %}
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-1.5">
        <span class="text-sm font-medium text-slate-700">봉투 {{ i }}</span>
        <input name="label{{ i }}" placeholder="이름 붙이기 (선택 · 예: 내과)"
               class="text-sm px-2.5 py-1 border rounded-lg w-52 focus:outline-none focus:ring-2 focus:ring-slate-300">
      </div>
      <textarea name="env{{ i }}" rows="3" placeholder="{% if i == 1 %}에어탈{{ '\n' }}로수젯{% endif %}"
        class="w-full text-sm px-3 py-2.5 border rounded-lg font-mono focus:outline-none focus:ring-2 focus:ring-slate-300"></textarea>
    </div>
    {% endfor %}
  </div>

  <div class="card p-5">
    <div class="font-medium mb-1">최근 신경 쓰이는 것이 있나요?</div>
    <p class="text-sm text-slate-500 mb-3">선택하시면 관련된 확인사항을 먼저 보여드립니다. 선택하지 않으셔도 됩니다.</p>
    <div class="flex flex-wrap gap-2">
      {% for key, label in symptoms %}
      <label class="cursor-pointer">
        <input type="checkbox" name="symptom" value="{{ key }}" class="peer sr-only">
        <span class="inline-block px-3.5 py-2 text-sm border rounded-full
                     peer-checked:bg-slate-800 peer-checked:text-white peer-checked:border-slate-800">
          {{ label }}
        </span>
      </label>
      {% endfor %}
    </div>
  </div>

  <button class="w-full bg-slate-900 text-white rounded-xl py-3.5 font-medium hover:bg-slate-800">
    확인하기
  </button>
</form>
{% endblock %}
